name: asic

# 组织级可复用流水线：一颗流片设计的后端从头走到尾，产物打包留作构件。
# 一次要几个小时，只有流片仓用得着，所以只手动触发。各仓的 asic.yml：
#
#   name: asic
#   on: workflow_dispatch
#   jobs:
#     asic:
#       uses: Tape-Out/.github/.github/workflows/asic.yml@main
#
# 跑的就是本机那一条 ran asic。ecc、综合工具与 PDK 由 ECOS 公开发布的安装脚本来装，
# 脚本里钉着各件的版本与摘要；输入 ecc 选的是哪一版脚本。

on:
  workflow_call:
    inputs:
      os:
        description: 托管机镜像。默认用最新的 LTS，系统包随之是新的（QEMU 10、Verilator 5.032、Python 3.14）；有特别要求的仓才钉旧的
        type: string
        default: ubuntu-26.04
      flow:
        description: ecc 预设。syn_sta 只到综合后时序，rtl2gds 走到版图
        type: string
        default: rtl2gds
      ecc:
        description: ecc 的发布版本，安装脚本按它取
        type: string
        default: v0.1.0-alpha.12
      bsc-ref:
        description: 取哪个 bsc 发布版
        type: string
        default: "2026.01"
      xirang-ref:
        description: 取哪个版本的 xirang
        type: string
        default: main
      apt:
        description: 展平要的额外系统包（空格分隔）
        type: string
        default: ""
      pip:
        description: 展平要的额外 Python 包（空格分隔）
        type: string
        default: ""
      sv2v:
        description: 要 sv2v 就写发布版本（如 v0.0.13）；空着不装
        type: string
        default: ""

permissions:
  contents: read

jobs:
  asic:
    runs-on: ${{ inputs.os }}
    # 托管机一个任务最多六小时
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
      NO_COLOR: "1"
      TERM: dumb
      COLUMNS: "200"
    steps:
      # Ubuntu 26.04 的 /tmp 是内存里的 tmpfs，按用户有配额：后端的输出有几个 G，写到一半报 Disk quota exceeded，
      # 占的还是内存。各步都往 /tmp 下写，所以作业一开始把它换到 /mnt 那块盘上
      - name: /tmp 放回磁盘
        run: |
          if [ "$(findmnt -n -o FSTYPE /tmp)" = tmpfs ]; then
            sudo mkdir -p /mnt/tmp
            sudo chmod 1777 /mnt/tmp
            sudo mount --bind /mnt/tmp /tmp
          fi
          df -h /tmp | tail -n 1

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 额外的系统包
        if: inputs.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ inputs.apt }}

      - name: 取缓存的 bsc
        id: bsc-cache
        uses: actions/cache@v6
        with:
          path: ~/bsc-install
          key: bsc-${{ inputs.bsc-ref }}-${{ inputs.os }}

      - name: 取 bsc
        if: steps.bsc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtcl8.6 || sudo apt-get install -y -qq tcl
          ver="${{ inputs.bsc-ref }}"
          . /etc/os-release
          for d in "ubuntu-$VERSION_ID" ubuntu-24.04 ubuntu-22.04 debian-12.13; do
            url="https://github.com/B-Lang-org/bsc/releases/download/$ver/bsc-$ver-$d.tar.gz"
            if curl -fsSL "$url" -o /tmp/bsc.tgz; then echo "取到 $d"; break; fi
          done
          test -s /tmp/bsc.tgz || { echo "::error::没有可用的 bsc 发布包"; exit 1; }
          mkdir -p "$HOME/bsc-install"
          tar xzf /tmp/bsc.tgz -C "$HOME/bsc-install" --strip-components=1

      # 缓存命中时上一步不跑，所以单列一步；黑盒仓的生成步骤里也可能回调息壤去装配一块 BSV 的外设
      - name: bsc 进 PATH
        run: echo "$HOME/bsc-install/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: 装 xirang
        run: |
          python3 -m pip install --quiet pyyaml pyslang
          git clone --depth 1 --branch ${{ inputs.xirang-ref }} \
            https://github.com/Tape-Out/xirang /tmp/xirang
          echo "PYTHONPATH=$(ls -d /tmp/xirang/packages/*/src | tr '\n' ':')" >> "$GITHUB_ENV"
          echo "$HOME/bsc-install/bin" >> "$GITHUB_PATH"

      - name: 额外的 Python 包
        if: inputs.pip != ''
        run: python3 -m pip install --quiet ${{ inputs.pip }}

      - name: sv2v
        if: inputs.sv2v != ''
        run: |
          curl -fsSL -o /tmp/sv2v.zip \
            "https://github.com/zachjs/sv2v/releases/download/${{ inputs.sv2v }}/sv2v-Linux.zip"
          unzip -q -o /tmp/sv2v.zip -d "$HOME/sv2v"
          echo "$HOME/sv2v/sv2v-Linux" >> "$GITHUB_PATH"

      # 与 ip.yml 同一段：清单里的依赖与实例，再往下一层
      - name: 拉依赖
        run: |
          mkdir -p /tmp/ws
          ln -s "$GITHUB_WORKSPACE" "/tmp/ws/$(basename "$GITHUB_REPOSITORY")"
          # 依赖与实例用到的包逐层取到头：流片仓可以依赖另一颗流片仓，那一颗自己还有实例。
          # 黑盒的源码在它自己的子模块里，不连子模块一起取就展不开
          python3 - <<'EOF'
          import pathlib, subprocess, yaml
          ws = pathlib.Path("/tmp/ws")
          seen, todo = set(), [p.name for p in ws.iterdir()]
          while todo:
              n = todo.pop()
              if n in seen:
                  continue
              seen.add(n)
              if not (ws / n).exists():
                  subprocess.run(["git", "clone", "--depth", "1", "--recurse-submodules", "--shallow-submodules",
                                  f"https://github.com/Tape-Out/{n}", str(ws / n)])
              y = ws / n / "ip.yaml"
              if y.exists():
                  d = yaml.safe_load(y.read_text(encoding="utf-8")) or {}
                  todo += list(d.get("deps") or {}) + [i["of"] for i in d.get("instances") or []]
          EOF
          ls /tmp/ws

      - name: 装 ecc、综合工具与 PDK
        run: |
          curl -fsSL "https://release.openecos.com/installers/ecc/${{ inputs.ecc }}/ecc-installer.sh" \
            | sh -s -- --with-toolchain --download-source github
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ecc" version
          ls -d "$HOME"/.local/share/ecc/pdks/*/v*

      # 布线后的时序分析要十来个 G，托管机只有 15 G 内存：不加交换区的话整台机器被收走，连构件都留不下
      - name: 加交换区
        run: |
          sudo fallocate -l 40G /mnt/xr.swap
          sudo chmod 600 /mnt/xr.swap
          sudo mkswap -q /mnt/xr.swap
          sudo swapon /mnt/xr.swap
          free -g

      - name: 后端
        shell: bash
        run: |
          cd /tmp/ws
          N="$(basename "$GITHUB_REPOSITORY")"
          df -h /tmp | tail -n 1
          # ran asic 跑完才出字。每两分钟报一次内存与 ecc 走到了哪一步，中途断了也看得出断在哪
          ( while sleep 120; do
              echo "[$(date +%T)] $(free -m | awk 'NR==2{printf "内存 %d MB ", $3} NR==3{printf "交换 %d MB", $3}') 步骤：$(ls -t /tmp/asic/default 2>/dev/null | head -n 3 | xargs)"
            done ) &
          timeout -k 60 320m python3 -m xirang.cli asic "$N" --flow "${{ inputs.flow }}" -o /tmp/asic 2>&1 | tee /tmp/asic.log

      - name: 结果
        if: always()
        run: |
          S="$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/asic/report.json ]; then
            echo '```json' >> "$S"
            python3 -m json.tool --no-ensure-ascii /tmp/asic/report.json | head -n 200 >> "$S"
            echo '```' >> "$S"
          else
            echo "没有 report.json：后端没走到出报告那一步" >> "$S"
          fi
          cp /tmp/asic.log /tmp/asic/ran-asic.log 2>/dev/null || true
          echo '```' >> "$S"
          du -sh /tmp/asic 2>/dev/null >> "$S" || true
          (cd /tmp/asic 2>/dev/null && find . -maxdepth 4 -type f -size +1M -printf '%s\t%p\n' | sort -n | tail -n 60) >> "$S" || true
          echo '```' >> "$S"
          tar --zstd -cf /tmp/asic.tar.zst -C /tmp asic 2>/dev/null || true
          ls -la /tmp/asic.tar.zst || true

      # 交付要的只是几样小东西：展平的 .v、报告、ecc.toml、签核包，外加各步的日志与报表（后端挂了靠它们看原因）。
      # 整个输出目录有六百多兆，从流水线取回来要半小时以上，所以这几样单独留一份
      - name: 交付件
        if: always()
        run: |
          mkdir -p /tmp/deliver
          cd /tmp/asic 2>/dev/null || exit 0
          if [ -d default/Harden_ecc ]; then
            # 等价比对没证完时 ecc 不肯出签核包（signoff_incomplete）：留下它说缺什么，
            # 云平台要的 DEF 与门级网表从最后一步的输出里直接取
            ecc signoff export --workspace default -o /tmp/deliver/signoff.tar.gz --plain \
              || ecc signoff inspect --workspace default > /tmp/deliver/signoff-inspect.txt 2>&1 || true
            # Harden 只出 GDS、LEF、LIB；布线并填充之后的 DEF 与门级网表在 filler 那一步的输出里
            ls default/filler_ecc/output default/Harden_ecc/output 2>/dev/null || true
            cp -f default/filler_ecc/output/*.def.gz /tmp/deliver/final.def.gz 2>/dev/null || true
            cp -f default/filler_ecc/output/*.v.gz /tmp/deliver/final.v.gz 2>/dev/null || true
            cp -f default/Harden_ecc/output/*.lef default/Harden_ecc/output/*.lib /tmp/deliver/ 2>/dev/null || true
          fi
          cp -f ./*.v report.json ecc.toml ran-asic.log /tmp/deliver/ 2>/dev/null || true
          find default -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.json' -o -name '*.txt' \) -size -8M -print0 \
            | tar --zstd -cf /tmp/deliver/logs.tar.zst --null -T - 2>/dev/null || true
          ls -la /tmp/deliver

      - name: 留下交付件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deliver-${{ github.event.repository.name }}-${{ inputs.flow }}
          path: /tmp/deliver
          retention-days: 30
          if-no-files-found: warn

      - name: 留下构件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asic-${{ github.event.repository.name }}-${{ inputs.flow }}
          path: /tmp/asic.tar.zst
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn

      # 布线后的网表配标准单元的功能模型，跑仓里 gate 任务挑的那几项整片测试。放在构件留下之后：慢了被掐也不丢后端的结果。
      # 没有 gate 任务的仓跳过
      - name: 门级冒烟
        if: success()
        run: |
          cd /tmp/ws
          N="$(basename "$GITHUB_REPOSITORY")"
          grep -q '^  gate:' "$GITHUB_WORKSPACE/ip.yaml" || { echo "$N 没有 gate 任务"; exit 0; }
          [ -s /tmp/deliver/final.v.gz ] || { echo "没有布线后的网表"; exit 1; }
          sudo apt-get install -y -qq iverilog > /dev/null
          python3 -m pip install --quiet cocotb==1.9.2
          cells=$(ls "$HOME"/.local/share/ecc/pdks/*/v*/IP/STD_cell/*/*/verilog/*.v 2> /dev/null || true)
          if [ -z "$cells" ]; then
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/openecos-projects/icsprout55-pdk /tmp/pdk
            git -C /tmp/pdk sparse-checkout set IP/STD_cell
            cells=$(ls /tmp/pdk/IP/STD_cell/*/*/verilog/*.v)
          fi
          echo "$cells"
          # 布线后的网表把向量口拆成了一根根标量口（io_in_0 …）：顶层改名成 <顶层>_net，另写一个同名的顶层拼回向量口，
          # 整片测试原样接得上。填充、接触、去耦这些物理单元没有功能模型，也不接线，删掉
          mkdir -p /tmp/gate
          python3 - /tmp/deliver/final.v.gz /tmp/gate/net.v <<'EOF'
          import gzip, re, sys
          from collections import defaultdict
          text = gzip.open(sys.argv[1], "rt", encoding="utf-8").read()
          m = re.search(r"\bmodule\s+(\w+)\s*\((.*?)\);", text, re.S)
          top = m.group(1)
          dirs = {n: d for d, n in re.findall(r"^\s*(input|output)\s+(\w+)\s*;", text, re.M)}
          vec, scalar = defaultdict(dict), []
          for q in re.findall(r"\w+", m.group(2)):
              v = re.fullmatch(r"(\w+?)_(\d+)", q)
              if v:
                  vec[v.group(1)][int(v.group(2))] = q
              else:
                  scalar.append(q)
          for base in [b for b, ix in vec.items() if len(ix) == 1]:
              scalar += vec.pop(base).values()
          ports = [f"  {dirs[q]} wire {q}" for q in scalar]
          conns = [f"    .{q}({q})" for q in scalar]
          for base, ix in sorted(vec.items()):
              ports.append(f"  {dirs[ix[max(ix)]]} wire [{max(ix)}:0] {base}")
              conns += [f"    .{n}({base}[{i}])" for i, n in sorted(ix.items())]
          body = re.sub(rf"\bmodule\s+{top}\b", f"module {top}_net", text, count=1)
          body, fills = re.subn(r"(?m)^\s*\w+\s+\w+\s*\(\s*\)\s*;\s*\n", "", body)
          wrap = f"module {top} (\n" + ",\n".join(ports) + f"\n);\n  {top}_net net (\n" + ",\n".join(conns) + "\n  );\nendmodule\n"
          open(sys.argv[2], "w", encoding="utf-8").write(body + "\n" + wrap)
          print(f"{top}：{len(vec)} 组向量口拼回，删掉 {fills} 个物理单元")
          EOF
          export GATE_NETLIST=/tmp/gate/net.v CHIP_ASIC=/tmp/asic GATE_CELLS="$(echo $cells)"
          python3 -m xirang.cli run "$N" gate -o /tmp/gate/run

      - name: 留下门级冒烟的结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-${{ github.event.repository.name }}
          path: |
            /tmp/gate/run/**/results.xml
            /tmp/gate/run/**/*.log
          if-no-files-found: ignore
          retention-days: 30
