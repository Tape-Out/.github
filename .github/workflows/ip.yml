name: ip

# 组织级可复用流水线。每个 IP 仓的 CI 压到八行：
#
#   name: ci
#   on: [push, pull_request, workflow_dispatch]
#   jobs:
#     ip:
#       uses: Tape-Out/.github/.github/workflows/ip.yml@main
#       permissions:
#         contents: write
#
# 门禁按代价从低到高排，前面的几乎免费、能挡住绝大多数问题：
#   清单校验 -> 生成 -> 类型检查 -> 矩阵测试 -> （仅当 hwsrc/ 变了）综合与面积回填
#
# 矩阵测试这一道是 xirang test：它把「调度门禁 + 寄存器一致性 + 各仓自己的
# 行为测试」在整张配置矩阵上各跑一遍。默认配置过了不等于别的配置也过——
# 门控写漏了的表现恰恰是「关掉了硬件还在」，只有单独关掉那一点看得出来。
# 本地跑同一条命令即可复现，流水线里不再有自己的一套 grep。
#
# 还没写 BSV 的仓也走前几道：寄存器图本身就该被检查，不必等实现。

on:
  workflow_call:
    inputs:
      bsc-ref:
        description: 取哪个 bsc 发布版
        type: string
        default: "2026.01"
      synth:
        description: 是否跑综合。默认只在 hwsrc/ 有改动时跑
        type: string
        default: auto
      nested-subs:
        description: >-
          上游自己还挂着一堆子模块时，只取这里列出的几个（空格分隔，相对上游仓根）。
          留空照旧递归全取。CVA6 递归一次会把 core-v-verif 与 riscv-isa-manual
          一起拖下来，而清单里一个文件都用不到
        type: string
        default: ""
      xirang-ref:
        description: >-
          取哪个版本的 xirang。默认跟着主线走，于是**工具要先于仓推送**：
          仓的门禁克隆的是当时的工具，工具后推就会用旧的跑新的清单。
          要固定就在这里钉一个标签。
        type: string
        default: main

permissions:
  contents: write        # 面积要写进 area 分支

jobs:
  gate:
    # spec 分支只放规范原件溯源、area 分支只放面积数据，都没有 ip.yaml；各仓 ci.yml 不限分支，在这里拦
    if: github.ref_name != 'spec' && github.ref_name != 'area'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2      # 要能 diff 上一次提交，判断 hwsrc/ 动没动
          # 黑盒仓把上游挂在 third_party/，不拉连清单都读不过
          submodules: ${{ inputs.nested-subs == '' && 'recursive' || true }}

      - name: 取上游自己的子模块（只取用得到的）
        if: inputs.nested-subs != ''
        run: |
          for d in third_party/*/; do
            git -C "$d" submodule update --init --recursive --depth 1 -- ${{ inputs.nested-subs }}
          done

      - name: 这次改到源码了吗
        id: changed
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -qE '^hwsrc/|^swsrc/|^htest/|^stest/|^regmap[.]yaml$|^ip[.]yaml$'; then
              echo "src=yes" >> "$GITHUB_OUTPUT"
            else
              echo "src=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "src=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 取缓存的 bsc
        id: bsc-cache
        uses: actions/cache@v6
        with:
          path: ~/bsc-install
          key: bsc-${{ inputs.bsc-ref }}-${{ runner.os }}

      # 用官方发布的预编译包。从源码编译要二十多分钟且依赖脆弱，
      # 而「跟得上上游」靠的是钉住哪个 release，不是自己编。
      - name: 取 bsc
        if: steps.bsc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtcl8.6 || sudo apt-get install -y -qq tcl
          ver="${{ inputs.bsc-ref }}"
          for d in ubuntu-24.04 ubuntu-22.04 debian-12.13; do
            url="https://github.com/B-Lang-org/bsc/releases/download/$ver/bsc-$ver-$d.tar.gz"
            if curl -fsSL "$url" -o /tmp/bsc.tgz; then echo "取到 $d"; break; fi
          done
          test -s /tmp/bsc.tgz || { echo "::error::没有可用的 bsc 发布包"; exit 1; }
          mkdir -p "$HOME/bsc-install"
          tar xzf /tmp/bsc.tgz -C "$HOME/bsc-install" --strip-components=1
          "$HOME/bsc-install/bin/bsc" -v | head -2

      - name: 装 xirang
        run: |
          python3 -m pip install --quiet pyyaml
          git clone --depth 1 --branch ${{ inputs.xirang-ref }} \
            https://github.com/Tape-Out/xirang /tmp/xirang
          echo "PYTHONPATH=$(ls -d /tmp/xirang/packages/*/src | tr '\n' ':')" >> "$GITHUB_ENV"

      # 从前这里是四路 grep：kind: library 归库、有 instances 归装配、有 verilog-flat
      # 归扁平、其余一律算「有寄存器图」。`rvdbg` 这种只出 BSV 的调试模块落进最后一档。
      # 现在问工具：ip.yaml 写了 targets 就照写的来，没写就由工具按同一套规则推断。
      - name: 这个包怎么构建
        id: how
        run: |
          D=$(python3 -c "
          import pathlib
          from xirang_core.manifest import Pkg
          p = Pkg(pathlib.Path('$GITHUB_WORKSPACE'))
          print(' '.join(sorted({v['driver'] for v in p.targets().values()})))")
          echo "drivers=$D" >> "$GITHUB_OUTPUT"
          # 单值 kind 照旧按这个优先级，各步的 if 用它
          for k in library assembly foreign flat regs bsv none; do
            case " $D " in *" $k "*) echo "kind=$k" >> "$GITHUB_OUTPUT"; break;; esac
          done
          echo "目标：$D"

      # 黑盒那一路要的两样：iverilog 跑上游自己的测试台，pyslang 把展开之后的
      # 端口表拿回来核对声明。装不上 pyslang 只会少一道核对，不会假装核对过了
      - name: 黑盒要的工具
        if: steps.how.outputs.kind == 'foreign'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          python3 -m pip install --quiet pyslang

      - name: 拉依赖
        run: |
          mkdir -p /tmp/ws
          ln -s "$GITHUB_WORKSPACE" "/tmp/ws/$(basename "$GITHUB_REPOSITORY")"
          for d in $(python3 -c "
          import yaml,sys
          d=yaml.safe_load(open('ip.yaml'))
          n=set((d.get('deps') or {}).keys())
          n |= {i['of'] for i in (d.get('instances') or [])}
          print(' '.join(sorted(n)))"); do
            git clone --depth 1 "https://github.com/Tape-Out/$d" "/tmp/ws/$d" || true
          done
          # 实例用到的包各自还有依赖，再拉一层就够——本版没有更深的
          for y in /tmp/ws/*/ip.yaml; do
            for d in $(python3 -c "
          import yaml,sys
          d=yaml.safe_load(open('$y'))
          print(' '.join((d.get('deps') or {}).keys()))"); do
              [ -d "/tmp/ws/$d" ] || git clone --depth 1 \
                "https://github.com/Tape-Out/$d" "/tmp/ws/$d" || true
            done
          done

      - name: 清单与锁
        run: |
          cd /tmp/ws
          python3 -m xirang.cli lint "$(basename "$GITHUB_REPOSITORY")"

      # 依赖的 hwsrc/ 也要进 bsc 的搜索路径，否则 import 找不到。
      # hwsrc/ 装的是硬件源码，目录名不绑语言；当前两种语法都在里面：.bsv 是 BSV，.bs 是 BH。
      # bsc 一视同仁，import 也认不出区别，所以不分两个目录。
      - name: 生成并类型检查
        run: |
          export PATH="$HOME/bsc-install/bin:$PATH"
          mkdir -p /tmp/out /tmp/b /tmp/b2 /tmp/rtl
          cd /tmp/ws
          N="$(basename "$GITHUB_REPOSITORY")"
          case "${{ steps.how.outputs.kind }}" in
            library)
              # 库包不生成东西，也不进地址图。先类型检查，再跑 htest/ 里的行为测试：
              # 地址图、写选通合并、总线绑定器都住在库包里，错了影响每一个 IP。
              for f in "$GITHUB_WORKSPACE"/hwsrc/*.bsv "$GITHUB_WORKSPACE"/hwsrc/*.bs; do
                [ -e "$f" ] || continue
                bsc +RTS -K512m -RTS -u -bdir /tmp/b -info-dir /tmp/b \
                    -p "/tmp/out:$(ls -d /tmp/ws/*/hwsrc 2>/dev/null | tr '\n' ':')+" "$f"
              done
              cd /tmp/ws && python3 -m xirang.cli test "$N" -o /tmp/lib
              echo "库包检查完毕"
              exit 0 ;;
            assembly)
              python3 -m xirang.cli build "$N" -o /tmp/asm --no-synth
              cp /tmp/asm/hwsrc/*.bsv /tmp/out/
              TOP=$(ls /tmp/out/*Pkg.bsv) ;;
            flat)
              python3 -m xirang.cli wrap "$N" -o /tmp/out
              TOP=$(ls /tmp/out/*Wrap.bsv) ;;
            foreign)
              echo "黑盒：RTL 是别人的，我们不生成也不编译它；测试在下一步"
              exit 0 ;;
            *)
              if [ -f "$GITHUB_WORKSPACE/regmap.yaml" ]; then
                python3 -m xirang.cli gen "$N" -o /tmp/gen
                cp /tmp/gen/hwsrc/*.bsv /tmp/out/
                TOP=$(ls /tmp/out/*Regs.bsv)
              else
                # 既不挂总线也没有寄存器图的 IP（rvdbg 的 DMI 由 JTAG 进，不对外露控制口）：
                # 没有生成物可编，直接编 emit 写的那个包。工作区软链在 /tmp/ws 里，路径不必再加
                TOP="/tmp/ws/$N/hwsrc/$(grep -m1 '^  package:' "$GITHUB_WORKSPACE/ip.yaml" | awk '{print $2}').bsv"
                [ -f "$TOP" ] || { echo "没有 regmap.yaml，也找不到 emit 写的包 $TOP"; exit 1; }
              fi ;;
          esac
          echo "TOP=$TOP" >> "$GITHUB_ENV"
          P="/tmp/out:$(ls -d /tmp/ws/*/hwsrc 2>/dev/null | tr '\n' ':')+"
          echo "BSVPATH=$P" >> "$GITHUB_ENV"
          # -u 只收一个源文件，依赖靠它自己顺着 import 找
          bsc +RTS -K512m -RTS -u -bdir /tmp/b -info-dir /tmp/b -p "$P" "$TOP"

      # 一条命令三件事：调度门禁、寄存器一致性、各仓自己的行为测试，
      # 在整张配置矩阵上各跑一遍。矩阵由 ip.yaml 的 test 段决定，默认 auto：
      # 每个开关单独开一次、单独关一次，每个参数取两端，外加默认与两个极端。
      # 只改了文档就只跑默认那一点。
      - name: 矩阵测试
        if: >-
          steps.how.outputs.kind != 'library' &&
          steps.how.outputs.kind != 'assembly' &&
          steps.how.outputs.kind != 'none'
        run: |
          export PATH="$HOME/bsc-install/bin:$PATH"
          cd /tmp/ws
          N="$(basename "$GITHUB_REPOSITORY")"
          if [ "${{ steps.changed.outputs.src }}" = "yes" ]; then
            python3 -m xirang.cli test "$N" -o /tmp/mx
          else
            python3 -m xirang.cli test "$N" -o /tmp/mx --point Default
          fi

      # 门禁过了还要说得清「这一版是什么」。三张表都读同一份解出来的数据，
      # 贴进 job summary：审 PR 的人不必把仓拉下来才看得见端点、依赖与引脚。
      # 摘要失效时 diffsigs 直接说是生成器变了还是源码变了，省掉人去 diff。
      - name: 这一版是什么
        if: always() && steps.how.outputs.kind != 'none'
        run: |
          cd /tmp/ws
          N="$(basename "$GITHUB_REPOSITORY")"
          S="$GITHUB_STEP_SUMMARY"
          say() { echo "### $1" >> "$S"; echo '```' >> "$S"; shift; "$@" >> "$S" 2>&1 || true; echo '```' >> "$S"; }
          say "包" python3 -m xirang.cli show "$N"
          if [ "${{ steps.how.outputs.kind }}" != "library" ]; then
            say "依赖" python3 -m xirang.cli inspect "$N" --deps
            say "引脚" python3 -m xirang.cli inspect "$N" --pins
          fi
          # 价目表失效时，说清是哪一部分变了
          if python3 -m xirang.cli diffsigs "$N" 2>/dev/null | grep -q "来自生成器\|源码动了"; then
            say "价目表摘要" python3 -m xirang.cli diffsigs "$N"
          fi

      # 装配没有自己的旋钮矩阵（它的矩阵是各实例矩阵的乘积，本版不做），
      # 所以还是单点跑：调度门禁看「会不会卡」，自检看「对不对」。
      - name: 装配的调度门禁
        if: steps.how.outputs.kind == 'assembly'
        run: |
          export PATH="$HOME/bsc-install/bin:$PATH"
          bsc +RTS -K512m -RTS -verilog -u -show-schedule -vdir /tmp/rtl -bdir /tmp/b2 -info-dir /tmp/b2 \
              -p "$BSVPATH" "$TOP" 2>&1 | tee /tmp/sched.log
          if grep -qE '[(]G0004[)]|[(]G0021[)]|[(]G0006[)]|[(]G0035[)]' /tmp/sched.log; then
            echo "::error::调度有问题，见上面的 G 编号"
            exit 1
          fi

      - name: 装配的自检
        if: steps.how.outputs.kind == 'assembly'
        run: |
          export PATH="$HOME/bsc-install/bin:$PATH"
          shopt -s nullglob
          gens=("$GITHUB_WORKSPACE"/htest/mk*.py)
          if [ ${#gens[@]} -eq 0 ]; then echo "没有 htest/，跳过"; exit 0; fi
          cd "$GITHUB_WORKSPACE/htest"
          for g in "${gens[@]}"; do python3 "$(basename "$g")" .; done
          mkdir -p /tmp/sim
          cd /tmp/ws
          for f in "$GITHUB_WORKSPACE"/htest/*Tb.bsv; do
            M="mk$(basename "$f" .bsv)"
            echo "--- $M ---"
            bsc +RTS -K512m -RTS -sim -u -bdir /tmp/sim -info-dir /tmp/sim \
                -simdir /tmp/sim -p "/tmp/out:$BSVPATH:$GITHUB_WORKSPACE/htest:+" \
                -g "$M" "$f"
            bsc -sim -e "$M" -o /tmp/sim/run -bdir /tmp/sim -simdir /tmp/sim
            /tmp/sim/run
          done

      # 面积在公共 runner 上量不了：ICS55 的 PDK 要登录 ECOS Factory 才取得到，
      # 而它既不能进公共仓也不该进缓存。所以这一步**先看有没有 PDK，没有就明说跳过**。
      #
      # 原来的写法是「装 ecc -> 综合 -> `|| true` -> 复制 `2>/dev/null || true`」，
      # 于是 `pdk.root is not a directory: /home/heke/...` 这个必然失败被完整吞掉，
      # area 分支每次照样提交一个只有时间戳的空目录，流水线照样绿。
      # **上线至今一个面积数据都没产出过，而没有任何人看得出来。**
      #
      # 正确性现在由另一条门禁担：`xirang lint` 会在源码变了而价目表没重测时报错，
      # 那条不需要 PDK。面积由本机 `xirang recal --apply` 测。
      - name: 综合并回填面积
        id: synth
        if: |
          steps.how.outputs.kind == 'flat' &&
          steps.changed.outputs.src == 'yes' && inputs.synth != 'never'
        continue-on-error: true
        run: |
          if [ -z "$XR_PDK_ROOT" ] && \
             [ -z "$(ls -d "$HOME"/.local/share/ecc/pdks/*/v* 2>/dev/null)" ]; then
            echo "::notice::没有 PDK，跳过面积测量。价目表由本机 recal 测，摘要过期时 lint 会报"
            echo "have=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL http://release.openecos.com/installers/ecc/latest/ecc-installer.sh \
            | sh -s -- --with-toolchain
          export PATH="$HOME/.local/bin:$HOME/bsc-install/bin:$PATH"
          N="$(basename "$GITHUB_REPOSITORY")"
          cd /tmp/ws && python3 -m xirang.cli build "$N" --neutral -o /tmp/syn
          mkdir -p /tmp/area && cp /tmp/syn/*.json /tmp/area/
          echo "have=$(ls /tmp/area/*.json | wc -l)" >> "$GITHUB_OUTPUT"

      - name: 面积没测出来就说出来
        if: |
          steps.how.outputs.kind == 'flat' &&
          steps.changed.outputs.src == 'yes' && inputs.synth != 'never' &&
          steps.synth.outputs.have == ''
        run: echo "::warning::综合没有产出面积数据，area 分支这次不更新——见上一步的日志"

      # 机器人不签名（D54）。面积写 area 分支，人 review 之后再搬进主分支——
      # 机器人永远碰不到主分支。
      #
      # **没有数据就不提交**：原来无条件提交，于是分支里只有一个 measured_at，
      # 看起来一直在更新，其实一个数都没有。
      - name: 把面积写进 area 分支
        if: |
          steps.changed.outputs.src == 'yes' && github.event_name == 'push' &&
          steps.synth.outputs.have != '' && steps.synth.outputs.have != '0' &&
          steps.synth.outputs.have != 'skip'
        run: |
          git config user.name  "xirang-bot"
          git config user.email "bot@tape-out.invalid"
          git config commit.gpgsign false
          git fetch origin area:area 2>/dev/null || git checkout --orphan area
          git checkout area 2>/dev/null || true
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p area && cp -r /tmp/area/* area/
          date -u +%FT%TZ > area/measured_at
          git add area
          git commit -m "area: ${GITHUB_SHA::8}" || exit 0
          git push origin area
